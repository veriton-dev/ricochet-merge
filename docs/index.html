<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ricochet Merge</title>
<style>
  html,body{margin:0;padding:0;background:#05070f;overflow:hidden;height:100%;}
  #c{display:block;width:390px;height:844px;touch-action:none;}
</style>
</head>
<body>
<canvas id="c" width="390" height="844"></canvas>
<script>
(function(){
"use strict";
var W=390,H=844;
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');

/* ---------- seeded PRNG (mulberry32) ---------- */
var RS=1;
function srand(s){RS=(s>>>0)||0x9e3779b9;}
function rnd(){
  RS=(RS+0x6D2B79F5)|0;
  var t=RS;
  t=Math.imul(t^(t>>>15),t|1);
  t^=t+Math.imul(t^(t>>>7),t|61);
  return ((t^(t>>>14))>>>0)/4294967296;
}
function rndInt(n){return Math.floor(rnd()*n)%n;}

/* ---------- constants ---------- */
var LX=195, LY=772, BR=10;
var DECK=838;              /* playable floor: balls bounce here instead of leaving */
var DECK_BOUNCES=7;
var SHOTS_PER_WAVE=12;

/* ---------- state ---------- */
var G={};
function newGame(seed){
  srand(seed);
  G={
    phase:'aiming', wave:1, score:0, combo:0, bestCombo:0,
    shotsLeft:SHOTS_PER_WAVE, lives:3, reviveUsed:false,
    hazards:[], balls:[], particles:[], cards:[], cardPicked:0,
    shake:0, time:0, aiming:false, aimX:195, aimY:600,
    awaiting_revive:false, game_over:false, seed:seed,
    up:{split:0,gravity:0,chain:0,pierce:0,merge:0},
    flash:0, lastFire:0, autoSim:false, banner:''
  };
  buildWave();
}

/* ---------- wave construction ---------- */
function buildWave(){
  G.hazards=[];
  var cols=5;
  var rows=2+Math.min(4,Math.floor((G.wave+1)/2));
  var cw=62, ch=44, gx=8, gy=8;
  var totalW=cols*cw+(cols-1)*gx;
  var sx=Math.round((W-totalW)/2);
  var sy=132;
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var hp=1+Math.floor((G.wave-1)/3)+(r===0?1:0);
      G.hazards.push({
        x:sx+c*(cw+gx), y:sy+r*(ch+gy), w:cw, h:ch,
        hp:hp, maxhp:hp, alive:true, hit:0,
        hue:(r*47+c*23+G.wave*11)%360
      });
    }
  }
  G.shotsLeft=SHOTS_PER_WAVE+ (G.up.shots||0);
}

/* ---------- upgrades ---------- */
var POOL=[
  {k:'split', n:'Split Shot', d:'+1 extra ball per throw'},
  {k:'gravity', n:'Gravity Well', d:'Balls curve toward aim'},
  {k:'chain', n:'Chain Arc', d:'Destroyed block hits neighbours'},
  {k:'pierce', n:'Pierce', d:'Balls pass through blocks'},
  {k:'merge', n:'Merge Multiplier', d:'Merge value x2 becomes x3'},
  {k:'shots', n:'Extra Ammo', d:'+4 throws each wave'}
];

function startDraft(){
  G.phase='draft';
  G.cards=[];
  var used={};
  while(G.cards.length<3){
    var i=rndInt(POOL.length);
    if(used[i]) continue;
    used[i]=1; G.cards.push(POOL[i]);
  }
  G.cardPicked=-1;
}

function applyCard(idx){
  if(idx<0||idx>=G.cards.length) return;
  var c=G.cards[idx];
  G.up[c.k]=(G.up[c.k]||0)+1;
  G.cardPicked=idx;
  G.wave++;
  G.reviveUsed=false;
  buildWave();
  G.phase='aiming';
  G.flash=0.35;
}

/* ---------- particles ---------- */
function burst(x,y,n,hue){
  for(var i=0;i<n;i++){
    var a=rnd()*6.28318, sp=40+rnd()*180;
    G.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+rnd()*0.5,max:1,hue:hue==null?200:hue,r:1+rnd()*2.5});
  }
}

/* ---------- audio ---------- */
var actx=null;
function sfx(freq,dur){
  if(!actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.value=0.06;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+Math.max(0.03,dur));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+Math.max(0.04,dur));
  }catch(e){}
}
function initAudio(){
  if(actx) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC) actx=new AC();
  }catch(e){ actx=null; }
}

/* ---------- firing ---------- */
function pushBall(x,y,vx,vy,val){
  G.balls.push({x:x,y:y,vx:vx,vy:vy,val:val,r:BR,alive:true,bounces:0});
}

function fire(){
  if(G.phase!=='aiming') return;
  if(G.shotsLeft<=0) return;
  G.shotsLeft--;
  var tx=G.aimX, ty=G.aimY;
  if(ty>LY-40) ty=LY-160;
  var dxT=tx-LX, dyT=ty-LY;

  /* ballistic solution: pick a time of flight so the arc passes through the aim
     point, then derive vx/vy. Longer drags fly flatter and faster. */
  var dist=Math.sqrt(dxT*dxT+dyT*dyT);
  if(dist<30){ dxT=0; dyT=-200; dist=200; }
  var tof=Math.max(0.42,Math.min(1.15,dist/520));
  var gv=330;
  var vx=dxT/tof;
  var vy=dyT/tof-0.5*gv*tof;
  /* cap so extreme corner aims stay sane */
  var vmag=Math.sqrt(vx*vx+vy*vy);
  var cap=1500;
  if(vmag>cap){ vx*=cap/vmag; vy*=cap/vmag; }

  pushBall(LX,LY,vx,vy,1);
  var extra=G.up.split||0;
  for(var i=0;i<extra;i++){
    var ang=(i%2===0?1:-1)*(0.20+0.10*Math.floor(i/2));
    var ca=Math.cos(ang), sa=Math.sin(ang);
    pushBall(LX,LY,vx*ca-vy*sa,vx*sa+vy*ca,1);
  }
  G.lastFire=G.time;
  sfx(300,0.09);
}

/* ---------- physics ---------- */
function hitHazard(h,val){
  h.hp-=val;
  h.hit=1;
  if(h.hp<=0){
    h.alive=false; h.hp=0;
    G.score+=h.maxhp*10*(1+G.combo*0.15)|0;
    G.combo++;
    if(G.combo>G.bestCombo) G.bestCombo=G.combo;
    G.shake=Math.min(12,G.shake+4);
    burst(h.x+h.w/2,h.y+h.h/2,10,h.hue);
    sfx(500+G.combo*40,0.06);
    if(G.up.chain){
      for(var i=0;i<G.hazards.length;i++){
        var n=G.hazards[i];
        if(!n.alive||n===h) continue;
        if(Math.abs((n.x+n.w/2)-(h.x+h.w/2))<70 && Math.abs((n.y+n.h/2)-(h.y+h.h/2))<60){
          hitHazard(n,1);
        }
      }
    }
  } else {
    G.shake=Math.min(8,G.shake+1.2);
    burst(h.x+h.w/2,h.y+h.h/2,4,h.hue);
  }
}

function physics(dt){
  var i,j,b,h;
  for(i=0;i<G.balls.length;i++){
    b=G.balls[i];
    if(!b.alive) continue;
    b.vy+=330*dt;
    if(G.up.gravity){
      var gx=G.aimX-b.x, gy=G.aimY-b.y;
      var gd=Math.sqrt(gx*gx+gy*gy)||1;
      b.vx+=(gx/gd)*220*dt*Math.min(2,G.up.gravity);
      b.vy+=(gy/gd)*220*dt*Math.min(2,G.up.gravity);
    }
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    if(b.x-b.r<0){ b.x=b.r; b.vx=-b.vx*0.94; b.bounces++; }
    if(b.x+b.r>W){ b.x=W-b.r; b.vx=-b.vx*0.94; b.bounces++; }
    if(b.y-b.r<0){ b.y=b.r; b.vy=-b.vy*0.94; b.bounces++; }
    if(b.y+b.r>DECK){
      /* deck ricochet: keeps a throw alive so one good aim chains across the field */
      b.y=DECK-b.r;
      b.vy=-Math.abs(b.vy)*0.82;
      b.vx*=0.97;
      b.bounces++;
      if(b.bounces>DECK_BOUNCES*3+40){ b.alive=false; G.combo=0; }
      continue;
    }

    for(j=0;j<G.hazards.length;j++){
      h=G.hazards[j];
      if(!h.alive) continue;
      if(b.x+b.r>h.x && b.x-b.r<h.x+h.w && b.y+b.r>h.y && b.y-b.r<h.y+h.h){
        var wasAlive=h.alive;
        hitHazard(h,b.val);
        /* destroyed blocks are punched through so a good line chains across the field;
           surviving blocks deflect the ball back */
        if(h.alive && !G.up.pierce){
          var cx=h.x+h.w/2, cy=h.y+h.h/2;
          var ox=Math.abs(b.x-cx)/(h.w/2), oy=Math.abs(b.y-cy)/(h.h/2);
          if(ox>oy) b.vx=-b.vx*0.9; else b.vy=-b.vy*0.9;
          b.x+=b.vx*dt*2.2; b.y+=b.vy*dt*2.2;
        }
        if(h.alive) break;
      }
    }
  }

  /* merge same-value balls */
  for(i=0;i<G.balls.length;i++){
    var a=G.balls[i];
    if(!a.alive) continue;
    for(j=i+1;j<G.balls.length;j++){
      var c=G.balls[j];
      if(!c.alive) continue;
      if(a.val===c.val){
        var ddx=a.x-c.x, ddy=a.y-c.y;
        if(Math.sqrt(ddx*ddx+ddy*ddy)<a.r+c.r){
          var mult=G.up.merge?3:2;
          a.val=a.val*mult;
          a.r=Math.min(24,BR+a.val*1.2);
          a.vx=(a.vx+c.vx)*0.5; a.vy=(a.vy+c.vy)*0.5;
          c.alive=false;
          G.score+=a.val*4|0;
          burst(a.x,a.y,12,160);
          sfx(760,0.07);
        }
      }
    }
  }

  var live=[];
  for(i=0;i<G.balls.length;i++) if(G.balls[i].alive) live.push(G.balls[i]);
  G.balls=live;
}

function particlesTick(dt){
  var out=[];
  for(var i=0;i<G.particles.length;i++){
    var p=G.particles[i];
    p.life-=dt;
    if(p.life<=0) continue;
    p.vy+=260*dt;
    p.vx*=0.99;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    out.push(p);
  }
  G.particles=out;
}

function aliveHazards(){
  var n=0;
  for(var i=0;i<G.hazards.length;i++) if(G.hazards[i].alive) n++;
  return n;
}

/* ---------- simulation step ---------- */
function step(dtMs, inp){
  inp=inp||{};
  var dt=Math.min(0.05,Math.max(0,(dtMs==null?16.6667:dtMs)/1000));
  G.time+=dt;

  if(inp.x!=null && inp.x===inp.x) G.aimX=inp.x*W;
  if(inp.y!=null && inp.y===inp.y) G.aimY=inp.y*H;
  if(inp.down) G.aiming=true;

  if(inp.tap){
    if(G.phase==='aiming'){ fire(); }
    else if(G.phase==='revive'){
      G.shotsLeft+=4; G.awaiting_revive=false; G.phase='aiming'; G.reviveUsed=true;
      G.flash=0.3; sfx(440,0.1);
    }
  }
  if(!inp.down) G.aiming=false;

  if(G.phase==='draft' && inp.choice!=null && inp.choice!==undefined){
    applyCard(inp.choice|0);
  }

  if(G.phase==='aiming'){
    physics(dt);
    particlesTick(dt);
    if(G.shake>0) G.shake=Math.max(0,G.shake-dt*26);
    if(G.flash>0) G.flash=Math.max(0,G.flash-dt*2.2);
    for(var i=0;i<G.hazards.length;i++){ if(G.hazards[i].hit>0) G.hazards[i].hit=Math.max(0,G.hazards[i].hit-dt*4); }

    if(aliveHazards()===0){ startDraft(); }
    else if(G.shotsLeft<=0 && G.balls.length===0){
      if(!G.reviveUsed){
        G.awaiting_revive=true; G.phase='revive';
      } else {
        G.game_over=true; G.phase='over';
      }
    }
  } else if(G.phase==='revive' || G.phase==='over' || G.phase==='draft'){
    particlesTick(dt);
    if(G.shake>0) G.shake=Math.max(0,G.shake-dt*26);
    if(G.flash>0) G.flash=Math.max(0,G.flash-dt*2.2);
  }

  if(!G.noDraw) draw();
}

function state(){
  return {
    phase:G.phase,
    wave:G.wave,
    score:G.score,
    entities:aliveHazards()+G.balls.length,
    combo:G.combo,
    game_over:G.game_over,
    awaiting_revive:G.awaiting_revive
  };
}

/* ---------- rendering ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function draw(){
  var sx=0, sy=0;
  if(G.shake>0.2){
    sx=(rnd()-0.5)*G.shake;
    sy=(rnd()-0.5)*G.shake;
  }
  ctx.setTransform(1,0,0,1,0,0);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0f22');
  g.addColorStop(0.55,'#0d1330');
  g.addColorStop(1,'#141a38');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(sx,sy);

  var i,h,b,p;

  /* grid glow bands */
  ctx.globalAlpha=0.15;
  ctx.strokeStyle='#2b3f7a';
  ctx.lineWidth=1;
  for(i=0;i<H;i+=48){
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke();
  }
  ctx.globalAlpha=1;

  /* hazards */
  for(i=0;i<G.hazards.length;i++){
    h=G.hazards[i];
    if(!h.alive) continue;
    var frac=h.hp/h.maxhp;
    var lum=40+Math.round(45*frac);
    var fill='hsl('+h.hue+',58%,'+Math.max(18,lum*0.55)+'%)';
    var edge='hsl('+h.hue+',80%,'+(58+Math.round(28*h.hit))+'%)';
    roundRect(h.x,h.y,h.w,h.h,7);
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.lineWidth=h.hit>0.1?3:1.6;
    ctx.strokeStyle=edge;
    ctx.stroke();
    ctx.fillStyle='rgba(235,244,255,'+(0.55+0.45*frac)+')';
    ctx.font='bold 16px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(String(h.hp),h.x+h.w/2,h.y+h.h/2);
  }

  /* aim guide */
  if(G.phase==='aiming' && G.aiming){
    ctx.globalAlpha=0.55;
    ctx.strokeStyle='#5ce7ff';
    ctx.lineWidth=2;
    ctx.setLineDash([7,8]);
    ctx.beginPath();
    ctx.moveTo(LX,LY);
    ctx.lineTo(G.aimX,G.aimY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(G.aimX,G.aimY,9,0,6.28318);
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  /* particles */
  for(i=0;i<G.particles.length;i++){
    p=G.particles[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    ctx.fillStyle='hsl('+p.hue+',90%,65%)';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,6.28318);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  /* balls */
  for(i=0;i<G.balls.length;i++){
    b=G.balls[i];
    var rgr=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,1,b.x,b.y,b.r);
    rgr.addColorStop(0,'#ffffff');
    rgr.addColorStop(0.5,'#7fe0ff');
    rgr.addColorStop(1,'#1b6fa8');
    ctx.fillStyle=rgr;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,6.28318);
    ctx.fill();
    ctx.fillStyle='#04121f';
    ctx.font='bold '+Math.max(9,Math.round(b.r*1.1))+'px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(b.val),b.x,b.y);
  }

  /* launcher */
  ctx.beginPath();
  ctx.arc(LX,LY,18,0,6.28318);
  ctx.fillStyle='#1b2340';
  ctx.fill();
  ctx.lineWidth=2.5;
  ctx.strokeStyle=G.shotsLeft>0?'#5ce7ff':'#5a6280';
  ctx.stroke();
  ctx.fillStyle=G.shotsLeft>0?'#cfe9ff':'#7a83a0';
  ctx.font='bold 13px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(G.shotsLeft),LX,LY);

  /* HUD */
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#9fb2d8';
  ctx.font='12px monospace';
  ctx.fillText('WAVE '+G.wave,16,32);
  ctx.fillText('SHOTS '+G.shotsLeft,16,50);
  ctx.textAlign='right';
  ctx.fillStyle='#7fe0ff';
  ctx.font='bold 20px monospace';
  ctx.fillText(String(G.score),W-16,34);
  if(G.combo>0){
    ctx.fillStyle='#ffcf5c';
    ctx.font='bold 13px monospace';
    ctx.fillText('COMBO x'+G.combo,W-16,54);
  }

  /* draft overlay */
  if(G.phase==='draft'){
    ctx.fillStyle='rgba(4,8,20,0.82)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#eaf3ff';
    ctx.font='bold 20px monospace';
    ctx.textAlign='center';
    ctx.fillText('WAVE '+G.wave+' CLEARED',W/2,150);
    ctx.fillStyle='#9fb2d8';
    ctx.font='12px monospace';
    ctx.fillText('pick one upgrade',W/2,176);
    for(i=0;i<G.cards.length;i++){
      var cy=230+i*168;
      var c=G.cards[i];
      roundRect(34,cy,W-68,140,14);
      ctx.fillStyle='rgba(30,44,84,0.95)';
      ctx.fill();
      ctx.lineWidth=2;
      ctx.strokeStyle='#4d7ec9';
      ctx.stroke();
      ctx.fillStyle='#7fe0ff';
      ctx.font='bold 16px monospace';
      ctx.textAlign='center';
      ctx.fillText(c.n,W/2,cy+52);
      ctx.fillStyle='#b9c8e6';
      ctx.font='12px monospace';
      ctx.fillText(c.d,W/2,cy+80);
      ctx.fillStyle='#5f7095';
      ctx.font='11px monospace';
      ctx.fillText('SLOT '+(i+1),W/2,cy+112);
    }
  }

  if(G.phase==='revive'){
    ctx.fillStyle='rgba(4,8,20,0.8)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#ffcf5c';
    ctx.font='bold 26px monospace';
    ctx.fillText('OUT OF THROWS',W/2,360);
    ctx.fillStyle='#cfe0ff';
    ctx.font='13px monospace';
    ctx.fillText('tap to continue',W/2,396);
    ctx.fillStyle='#8fa2c8';
    ctx.font='12px monospace';
    ctx.fillText('+4 throws and a shield',W/2,422);
    ctx.fillStyle='#ffcf5c';
    ctx.font='bold 15px monospace';
    ctx.fillText('CONTINUE',W/2,486);
    roundRect(120,462,150,50,10);
    ctx.strokeStyle='#ffcf5c';
    ctx.lineWidth=2;
    ctx.stroke();
  }

  if(G.phase==='over'){
    ctx.fillStyle='rgba(4,8,20,0.88)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#ff7b7b';
    ctx.font='bold 26px monospace';
    ctx.fillText('GAME OVER',W/2,380);
    ctx.fillStyle='#cfe0ff';
    ctx.font='14px monospace';
    ctx.fillText('score '+G.score,W/2,414);
    ctx.fillStyle='#9fb2d8';
    ctx.font='12px monospace';
    ctx.fillText('wave '+G.wave+'   best combo '+G.bestCombo,W/2,440);
  }

  if(G.flash>0){
    ctx.globalAlpha=G.flash*0.5;
    ctx.fillStyle='#7fe0ff';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

/* ---------- public bridge ---------- */
window.__GAME={
  reset:function(seed){
    newGame(seed);
    G.autoSim=false;
    draw();
  },
  step:function(dtMs,inp){ step(dtMs,inp); },
  state:function(){ return state(); }
};

/* debug hook for local self-play only; not part of the required bridge */
window.__GAME_DEBUG={
  hazards:function(){
    var out=[];
    for(var i=0;i<G.hazards.length;i++){
      var h=G.hazards[i];
      if(h.alive) out.push({x:h.x,y:h.y,w:h.w,h:h.h,hp:h.hp});
    }
    return out;
  },
  launcher:{x:LX,y:LY},
  setNoDraw:function(v){ G.noDraw=!!v; },
  drawNow:function(){ draw(); }
};

/* ---------- interactive loop ---------- */
var lastT=0;
function loop(t){
  var now=(typeof t==='number')?t:0;
  if(G.autoSim){
    var dt=(now-lastT)/1000;
    lastT=now;
    if(!(dt>0)) dt=0;
    if(dt>0.05) dt=0.05;
    if(dt>0){
      step(dt*1000, pointer);
      if(tapped){ pointer={x:pointer.x,y:pointer.y,down:pointer.down,tap:true,choice:null}; tapped=false; }
    }
  } else {
    lastT=now;
  }
  draw();
  if(window.requestAnimationFrame) requestAnimationFrame(loop);
}

var pointer={x:0.5,y:0.6,down:false,tap:false,choice:null};
var tapped=false;
function toUnit(e){
  var r=cv.getBoundingClientRect();
  var cx=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
  var cy=(e.touches&&e.touches[0])?e.touches[0].clientY:e.clientY;
  var x=(cx-r.left)/r.width;
  var y=(cy-r.top)/r.height;
  return {x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))};
}
function down(e){
  initAudio();
  var p=toUnit(e);
  G.aimX=p.x*W; G.aimY=p.y*H;
  pointer={x:p.x,y:p.y,down:true,tap:false,choice:null};
  tapped=false;
  if(e.cancelable) e.preventDefault();
}
function move(e){
  var p=toUnit(e);
  G.aimX=p.x*W; G.aimY=p.y*H;
  pointer.x=p.x; pointer.y=p.y; pointer.down=true;
  if(e.cancelable) e.preventDefault();
}
function up(e){
  var p=toUnit(e);
  if(G.phase==='draft'){
    var py=p.y*H;
    for(var ci=0;ci<G.cards.length;ci++){
      var cy=230+ci*168;
      if(py>=cy && py<=cy+140){ pointer.choice=ci; break; }
    }
  }
  else { pointer.tap=true; }
  pointer.down=false;
  tapped=true;
  if(e.cancelable) e.preventDefault();
}
cv.addEventListener('mousedown',down);
cv.addEventListener('mousemove',function(e){ if(pointer.down) move(e); });
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up,{passive:false});

/* ---------- boot ---------- */
newGame(42);
G.autoSim=true;
draw();
if(window.requestAnimationFrame) requestAnimationFrame(loop);
})();
</script>
